<style>
:root{--ink:#1c0a0e;--wine:#4a1620;--cream:#efe6d6;--cream2:#e3d6bf;--dark:#2a1014;--brass:#c9a25a;--brass-hi:#e6c581;--mute:#bfae9a;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--ink);color:var(--cream);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
p,h1,h2,h3{margin:0}a{color:inherit}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
h2,h3{font-family:var(--serif);font-weight:500;line-height:1}
.btn{background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border:1px solid var(--brass);border-radius:999px;font:700 14px var(--sans);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s,transform .25s}
.gold{background:var(--brass);color:var(--ink)}.gold:hover{background:var(--brass-hi)}
.ghost:hover{background:rgba(201,162,90,.16)}
.eyebrow{font:500 12px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
.eyebrow.dk{color:#8a6a2c}.mt18{margin-top:18px}

header{position:fixed;inset:0 0 auto 0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(rgba(28,10,14,.72),rgba(28,10,14,0));transition:background .3s}header.lt{background:linear-gradient(rgba(239,230,214,.94),rgba(239,230,214,0))}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font:600 28px var(--serif);text-decoration:none}.logo i{color:var(--brass-hi)}
header nav{display:flex;gap:34px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
header nav a{text-decoration:none;color:var(--cream);opacity:.8}header nav a:hover{opacity:1}
header.lt .logo,header.lt nav a{color:var(--dark)}header.lt .logo i{color:#8a2a3a}header.lt .btn{color:var(--dark);border-color:#8a6a2c;background:rgba(239,230,214,.7)}header .logo,header nav a{transition:color .3s}
header .btn{min-height:42px;padding:0 22px;font-size:12px;background:rgba(28,10,14,.55);backdrop-filter:blur(8px)}
@media(max-width:760px){header nav{display:none}}

.pin{position:relative}
.stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}

/* HERO */
.hero{height:320vh;background:var(--ink)}
.hero .stick{display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(60vw 36vw at var(--mx,50%) var(--my,52%),rgba(130,38,56,.6),transparent 70%),var(--ink)}
.hero h1{width:min(1280px,94vw);font-weight:500;position:relative;z-index:2}
.giant{position:absolute;top:50%;left:0;font:600 34vw/1 var(--serif);white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(201,162,90,.2);pointer-events:none;will-change:transform}
.ln{display:block;overflow:hidden;padding:0 .04em .1em;margin-bottom:-.1em}.ln>span{display:block;transform:translateY(110%);transition:transform 1.3s cubic-bezier(.16,1,.3,1)}.go .ln>span{transform:none}.l2 .ln>span{transition-delay:.22s}
.prog{position:fixed;top:0;left:0;right:0;height:3px;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,var(--brass),var(--brass-hi));z-index:40}
.l1,.l2{display:block;font:500 min(9.6vw,15vh)/.96 var(--serif);letter-spacing:-.025em;will-change:transform}
.l2{text-align:right;font-style:italic;color:var(--brass-hi)}
#sc{opacity:0;transition:opacity 1s .2s,transform .35s ease-out;display:block;--cw:min(114%,150vh);width:var(--cw);max-width:none;height:auto;margin:0 calc((100% - var(--cw))/2);will-change:transform;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.hero .eyebrow{position:absolute;top:calc(env(safe-area-inset-top,0px) + 92px);left:0;right:0;text-align:center}
.sub{position:absolute;left:max(20px,calc(50% - 590px));right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;align-items:center;flex-wrap:wrap;gap:18px 34px}
.sub p{max-width:36ch;color:var(--mute);font-size:16px}
.sub div{display:flex;gap:12px;flex-wrap:wrap}
.go #sc{opacity:1}.hint::after{content:'';display:block;width:1px;height:38px;margin:10px auto 0;background:var(--brass);animation:ln 2s ease-in-out infinite}@keyframes ln{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.hint{text-align:center;position:absolute;right:max(20px,calc(50% - 590px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
@media(max-width:760px){#sc{--cw:136vw}.l1,.l2{font-size:min(11.6vw,15vh)}.hint{display:none}.sub p{font-size:14px}.sub .btn{min-height:46px;padding:0 20px;font-size:12px}}

/* MIRROR PORTAL */
.mir{height:420vh;background:var(--cream);color:var(--dark)}
.mir .stick{background:var(--cream)}
.back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 7vh)}
.back h2{font-size:clamp(40px,7.6vw,124px);letter-spacing:-.025em}
.back h2 em{color:#8a2a3a}
.back .eyebrow{margin-bottom:22px;color:#8a6a2c}
.portal{position:absolute;inset:0;background:radial-gradient(70vmax 50vmax at 50% 35%,#6b1f2c,var(--ink) 75%);clip-path:ellipse(9% 16% at 50% 50%);display:flex;align-items:center;justify-content:center;padding:0 clamp(24px,8vw,140px)}
.ring{position:absolute;left:50%;top:50%;width:18%;height:32%;transform:translate(-50%,-50%);border:3px solid var(--brass);border-radius:50%;box-shadow:0 0 0 10px rgba(201,162,90,.18),0 20px 60px rgba(0,0,0,.35);pointer-events:none}
.quotes{position:relative;width:min(1000px,100%);min-height:60vh;opacity:0}
.q{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;color:var(--cream)}
.q .stars{color:var(--brass);letter-spacing:6px;margin-bottom:24px}
.q p{font:500 clamp(28px,5vw,64px)/1.08 var(--serif)}
.q cite{margin-top:28px;font:500 13px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--brass-hi);font-style:normal}

/* STATEMENT + MARQUEE */
.say{height:260vh;background:var(--ink)}.say .stick{display:flex;align-items:center;padding:0 clamp(20px,8vw,140px)}
.say p{font:500 clamp(34px,6.4vw,100px)/1.05 var(--serif);letter-spacing:-.02em;max-width:17em}.say span{display:inline-block;margin-right:.26em;opacity:.14;will-change:opacity}.say .e{color:var(--brass-hi);font-style:italic}
.mq{overflow:hidden;background:var(--brass);color:var(--ink);padding:16px 0;white-space:nowrap}.mq div{display:inline-block;font:600 clamp(20px,2.6vw,32px) var(--serif);letter-spacing:.14em;text-transform:uppercase;animation:mq 34s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
/* SERVICES */
.svc{background:var(--cream);color:var(--dark);padding-block:clamp(70px,11vw,150px)}
.svc h2{font-size:clamp(46px,8vw,120px);letter-spacing:-.02em;max-width:12ch}
.svc h2 em{color:#8a2a3a}
.svc .lead{margin:24px 0 56px;max-width:44ch;color:#5a3a3e}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid rgba(42,16,20,.28)}
.rows li{display:grid;grid-template-columns:1.1fr 1fr;gap:6px 40px;align-items:baseline;padding:28px 0;border-bottom:1px solid rgba(42,16,20,.28);transition:padding-left .35s,color .35s}
.rows li:hover{padding-left:18px;color:#8a2a3a}
.rows h3{font-size:clamp(32px,5vw,64px)}
.rows p{color:#5a3a3e;font-size:16px}
.note{margin-top:24px;font-size:14px;color:#5a3a3e}
@media(max-width:760px){.rows li{grid-template-columns:1fr}}

/* VISIT */
.visit{background:var(--ink);padding-block:clamp(70px,11vw,150px)}
.visit .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(30px,6vw,90px);align-items:end}
.visit h2{font-size:clamp(46px,8vw,120px);letter-spacing:-.02em}
.visit h2 em{color:var(--brass-hi)}
.walk{margin-top:36px;display:grid;gap:14px;color:var(--mute)}
.walk p{padding-left:20px;border-left:2px solid var(--brass)}.walk b{color:var(--cream);font-weight:500}
.card{border:1px solid var(--brass);border-radius:200px 200px 6px 6px;padding:clamp(48px,7vw,80px) clamp(26px,4vw,48px) 40px;background:linear-gradient(170deg,var(--wine),var(--ink));text-align:center}
.card dl{margin:0 0 28px;display:grid;gap:18px}.card dt{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.card dd{margin:2px 0 0;font:500 24px/1.25 var(--serif)}.card a.t{text-decoration:none;border-bottom:1px solid var(--brass)}
@media(max-width:860px){.visit .wrap{grid-template-columns:1fr}}

/* FINAL */
.fin{height:240vh;background:var(--ink)}
.fin .stick{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;background:radial-gradient(60vw 34vw at 50% 60%,rgba(120,36,52,.5),transparent 70%),var(--ink)}
.fin h2{font-size:min(11vw,17vh);letter-spacing:-.03em}.fin h2 em{color:var(--brass-hi)}
.fin canvas{display:block;width:min(125vw,125vh);max-width:none;height:auto;margin:0 auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.fin .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
footer{padding:30px 0 44px;border-top:1px solid rgba(201,162,90,.25);font-size:14px;color:var(--mute)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

.cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--brass);border-radius:50%;pointer-events:none;z-index:60;opacity:0;transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}.cur.on{opacity:.9}.cur.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(201,162,90,.15)}
@media(hover:none){.cur{display:none}}
.faq{background:var(--ink);padding-block:clamp(70px,10vw,130px);border-top:1px solid rgba(201,162,90,.2)}.faq h2{font-size:clamp(42px,6.4vw,92px);letter-spacing:-.02em;margin:18px 0 44px}.faq h2 em{color:var(--brass-hi)}
details{border-bottom:1px solid rgba(201,162,90,.28)}details:first-of-type{border-top:1px solid rgba(201,162,90,.28)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;font:500 clamp(24px,3.2vw,38px)/1.1 var(--serif)}summary::-webkit-details-marker{display:none}summary::after{content:"+";font:300 40px var(--sans);color:var(--brass);transition:transform .3s}details[open] summary::after{transform:rotate(45deg)}details p{padding:0 0 28px;max-width:60ch;color:var(--mute)}
.bar2{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:35;display:none;gap:8px;padding:8px;border-radius:999px;background:rgba(28,10,14,.88);backdrop-filter:blur(12px);border:1px solid rgba(201,162,90,.4);transform:translateY(160%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}.bar2.on{transform:none}.bar2 .btn{flex:1;min-height:46px;padding:0 8px;font-size:12px}
@media(max-width:760px){.bar2{display:flex}footer{padding-bottom:96px}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.hero,.mir,.fin,.say{height:auto}.ln>span{transform:none;transition:none}#sc{opacity:1;transition:none}.mq div,.hint::after{animation:none}.say span{opacity:1}.rv{opacity:1;transform:none;transition:none}}
.rows li{grid-template-columns:1fr auto;gap:12px 32px;align-items:center}.rows li p{margin-top:8px}
.meta{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}.pr{font:600 28px var(--serif)}.du{font-size:14px;color:#5a3a3e;white-space:nowrap}
.btn.sm{min-height:44px;padding:0 20px;font-size:12px}
@media(max-width:760px){.rows li{grid-template-columns:1fr}}

/* ===== v2: polish, languages, mobile ===== */
[hidden]{display:none!important}
.l1,.l2{font-size:min(9.2vw,13vh)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
a,button,summary{-webkit-tap-highlight-color:transparent}
.gold{background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 8px 24px -10px rgba(201,162,90,.6)}
.gold:hover{background:linear-gradient(180deg,#f2d899,var(--brass-hi))}
.hr{display:flex;align-items:center;gap:14px}
.lang{display:inline-flex;padding:3px;border:1px solid rgba(201,162,90,.4);border-radius:999px;background:rgba(28,10,14,.55);backdrop-filter:blur(8px)}
.lang button{border:0;background:transparent;color:var(--cream);font:700 11px var(--sans);letter-spacing:.08em;min-width:40px;min-height:36px;padding:0 8px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.lang button[aria-pressed=true]{background:var(--brass);color:var(--ink)}
header.lt .lang{background:rgba(239,230,214,.75);border-color:#8a6a2c}header.lt .lang button{color:var(--dark)}header.lt .lang button[aria-pressed=true]{background:var(--dark);color:var(--cream)}
.l1 .ln>span,.l2 .ln>span{white-space:nowrap}
.rows{border:0;display:grid;gap:12px}
.rows li{padding:24px 28px;border:1px solid rgba(42,16,20,.16);border-radius:20px;background:rgba(255,255,255,.4)}
.rows li:hover{padding-left:28px;color:inherit;background:#fff8ea;border-color:#8a2a3a;box-shadow:0 18px 34px -22px rgba(74,22,32,.5)}
.rows li:hover h3{color:#8a2a3a}
details{transition:background .25s}details[open]{background:rgba(201,162,90,.05)}
summary{padding-inline:4px}summary:hover{color:var(--brass-hi)}
.card{box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.walk p{background:linear-gradient(90deg,rgba(201,162,90,.07),transparent);padding-block:8px}
footer{background:rgba(0,0,0,.18)}
.gl{position:absolute;inset:0;pointer-events:none;will-change:transform,clip-path}
.giant{top:0;color:rgba(201,162,90,.05);-webkit-text-stroke:1.5px rgba(201,162,90,.34)}
#sc{margin:-3.5vw calc((100% - var(--cw))/2)}
.fin canvas{width:min(112vw,125vh);margin-block:-3vw}
.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
@media(hover:none){.rows li:hover{background:rgba(255,255,255,.4);border-color:rgba(42,16,20,.16);box-shadow:none}.rows li:hover h3{color:inherit}}
@media(max-width:760px){
body{font-size:16px}
.wrap{width:calc(100% - 32px)}
header{background:rgba(28,10,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}header.lt{background:rgba(239,230,214,.93)}
.bar{height:60px}.hr>.btn{display:none}.logo{font-size:24px}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
.hero .eyebrow{top:calc(env(safe-area-inset-top,0px) + 78px);font-size:10px;letter-spacing:.16em;padding:0 16px}
.l1,.l2{font-size:min(10.4vw,12.5vh)}
#sc{--cw:112vw}.giant{font-size:46vw}
.sub{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);gap:14px}
.sub p{font-size:14px;line-height:1.5;max-width:none}
.sub div{width:100%}.sub .btn{flex:1;padding:0 12px}
.back h2{font-size:clamp(38px,11vw,56px)}
.q p{font-size:clamp(22px,6.4vw,30px)}.q .stars{margin-bottom:14px}.q cite{font-size:11px;margin-top:18px}
.say p{font-size:clamp(30px,9vw,44px)}
.svc h2,.visit h2{font-size:clamp(40px,12vw,56px)}
.rows li{padding:18px}.rows h3{font-size:30px}.meta{justify-content:space-between}.meta .btn{width:100%;order:3}
.card{border-radius:140px 140px 10px 10px}
.fin h2{font-size:min(12vw,10vh)}.fin canvas{width:104vw}#sc{margin-block:-5vw}
.fin .row{flex-direction:column;width:100%;max-width:340px}.fin .row .btn{width:100%}
summary{font-size:22px;padding:20px 0}
.bar2{left:10px;right:10px}
}
/* ===== booking dialog (restored from the template, now backed by the booking server) ===== */
dialog{border:1px solid var(--brass);background:linear-gradient(170deg,var(--wine),var(--ink));color:var(--cream);width:min(560px,100% - 24px);max-height:calc(100svh - 24px);padding:0;border-radius:22px;overflow:auto;margin:auto}dialog::backdrop{background:rgba(10,3,5,.72);backdrop-filter:blur(6px)}body:has(dialog[open]){overflow:hidden}
.bk{padding:clamp(24px,5vw,40px);position:relative}.bk h3{font-size:clamp(34px,5vw,46px);margin-bottom:8px;padding-right:48px}.bk .sm{color:var(--mute);font-size:15px}
.bk .lb{display:block;margin:22px 0 10px;font:500 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:44px;padding:0 16px;border:1px solid rgba(201,162,90,.4);border-radius:999px;background:transparent;color:var(--cream);font:500 14px var(--sans);cursor:pointer;transition:background .2s,color .2s,border-color .2s}.chip:hover{border-color:var(--brass)}.chip[aria-pressed=true]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.bk input{width:100%;min-height:50px;padding:0 16px;border-radius:12px;border:1px solid rgba(201,162,90,.4);background:rgba(0,0,0,.25);color:var(--cream);font:400 16px var(--sans)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.acts .btn{width:100%}.acts .full{grid-column:1/-1}
.x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,162,90,.4);background:transparent;color:var(--cream);font-size:24px;cursor:pointer}
.sum{margin-top:20px;padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.28);font-size:14.5px;color:var(--mute)}
#bt:focus{outline:none}.steps{display:flex;gap:6px;list-style:none;margin:14px 0 0;padding:0}.steps li{flex:1;height:4px;border-radius:2px;background:rgba(201,162,90,.25)}.steps .on{background:var(--brass)}.steps .done{background:var(--brass-hi)}
.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
